services:

  main-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careequity-main-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:3513@host.docker.internal:5432/careequity
      RAZORPAY_KEY_ID: rzp_test_TRtTOuWOsWyK15
      RAZORPAY_KEY_SECRET: 6CpEEmS1w4qzyi6A1lYwdETj
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/src:/app/src
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  main-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careequity-main-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_RAZORPAY_KEY_ID: rzp_test_TRtTOuWOsWyK15
    depends_on:
      main-backend:
        condition: service_healthy
    restart: unless-stopped

  ocr-backend:
    build:
      context: ./ocr
      dockerfile: Dockerfile
    container_name: careequity-ocr-backend
    ports:
      - "8001:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./ocr/src:/app/src
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ocr-frontend:
    build:
      context: ./ocr/ocr-ui
      dockerfile: Dockerfile
    container_name: careequity-ocr-frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://ocr-backend:8000
    depends_on:
      ocr-backend:
        condition: service_healthy
    restart: unless-stopped

  rag-backend:
    build:
      context: ./rag
      dockerfile: Dockerfile
    container_name: careequity-rag-backend
    ports:
      - "8002:8000"
    env_file:
      - ./rag/.env
    environment:
      - NEO4J_URI=neo4j+s://8357afa1.databases.neo4j.io
      - NEO4J_USERNAME=8357afa1
      - NEO4J_PASSWORD=zY1Fk-hmxuF02rmC9M8aYLYAqfTj3-AvErXJObPJafE
      - NEO4J_DATABASE=8357afa1
      - AURA_INSTANCEID=8357afa1
      - AURA_INSTANCENAME=Instance01
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - FASTAPI_URL=http://localhost:8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rag-frontend:
    build:
      context: ./rag
      dockerfile: Dockerfile.streamlit
    container_name: careequity-rag-frontend
    ports:
      - "8502:8502"
    env_file:
      - ./rag/.env
    environment:
      - FASTAPI_URL=http://rag-backend:8000
      - NEO4J_URI=neo4j+s://8357afa1.databases.neo4j.io
      - NEO4J_USERNAME=8357afa1
      - NEO4J_PASSWORD=zY1Fk-hmxuF02rmC9M8aYLYAqfTj3-AvErXJObPJafE
      - NEO4J_DATABASE=8357afa1
      - AURA_INSTANCEID=8357afa1
      - AURA_INSTANCENAME=Instance01
    depends_on:
      rag-backend:
        condition: service_healthy
    restart: unless-stopped