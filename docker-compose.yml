services:

  main-backend:
    build:
      context: ./ocr
      context: ./backend
      dockerfile: Dockerfile
    container_name: careequity-main-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:3513@host.docker.internal:5432/careequity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  main-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careequity-main-frontend
    ports:
      - "5173:5173"
    depends_on:
      main-backend:
        condition: service_healthy
    restart: unless-stopped

  ocr-frontend:
    build:
      context: ./ocr/ocr-ui
      dockerfile: Dockerfile
    container_name: careequity-ocr-frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://main-backend:8000
    depends_on:
      main-backend:
        condition: service_healthy
    restart: unless-stopped