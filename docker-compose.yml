services:

  ocr-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: careequity-ocr-backend

    ports:
      - "8001:8001"

    environment:
      DATABASE_URL: postgresql://postgres:3513@host.docker.internal:5432/CareEquity

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  ocr-ui:
    build:
      context: ./ocr-ui
      dockerfile: Dockerfile

    container_name: careequity-ocr-ui

    ports:
      - "8501:8501"

    environment:
      BACKEND_URL: http://ocr-backend:8001/api


    depends_on:
      ocr-backend:
        condition: service_healthy

    restart: unless-stopped