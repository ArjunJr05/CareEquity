name: CareEquity CI/CD Pipeline

on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  integration:
    name: Continuous Integration & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Ensure .env files exist for CI
        run: |
          touch .env || true
          touch rag/.env || true
          touch research_assis/.env || true

      - name: Verify Docker Compose Configuration
        run: docker compose config

  Continuous-Deployment:
    name: Continuous Deployment (EC2 Runner)
    needs: integration
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Ensure .env files exist on EC2 deployment
        run: |
          touch .env || true
          touch rag/.env || true
          touch research_assis/.env || true

      - name: Clean disk space before build
        run: |
          docker system prune -af --volumes || true

      - name: Build and Start CareEquity Multi-Container Stack
        run: |
          docker compose up -d --build --remove-orphans

      - name: Verify Running Containers
        run: |
          docker compose ps

      - name: Clean unused images
        run: |
          docker image prune -f || true
